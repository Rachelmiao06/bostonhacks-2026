name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Next.js generates route types (LayoutProps etc.); tsc needs them first.
      - run: npx next typegen
      - run: npx tsc --noEmit
      # Behaviour tests: they fail if a redesign breaks drafts, checks, photos, tokens, stats states or the nav.
      - run: npm test
      - run: npm run build
