# Keeps outage data fresh even when nobody has the app open.
# Loading /api/quests makes the server fetch MBTA and record which outages were fixed.
# Runs only from the default branch. GitHub may delay scheduled runs by several minutes.
name: Sync MBTA outages
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sS --max-time 30 -o /dev/null -w "status %{http_code}\n" https://bostonhacks-2026.vercel.app/api/quests || echo "site not reachable"
